<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf8f5"><meta name="description" content="WOYKE local demo checkout."><title>Checkout - WOYKE</title><link rel="stylesheet" href="/assets/css/site.css"></head><body data-page="checkout" data-initial-header="light"><a class="skip-link" href="#main">Skip to content</a><header id="site-header"></header><div id="mobile-menu"></div><main id="main"><section class="page-hero checkout-hero" data-header-theme="light"><div class="container"><div class="section-kicker">Checkout / local demonstration</div><h1 class="display-lg">Complete the ritual.</h1><p class="lede">One clear review of the piece, recipient and destination. No payment will be charged.</p></div></section><section class="scene scene-ivory checkout-scene" data-header-theme="light"><div class="container checkout-layout"><form id="checkout-form" class="checkout-form" novalidate><fieldset><legend>Contact</legend><div class="form-grid"><label>Email<input required type="email" name="email" autocomplete="email"><span class="field-error" data-error-for="email"></span></label><label>Phone<input required name="phone" autocomplete="tel"><span class="field-error" data-error-for="phone"></span></label></div></fieldset><fieldset><legend>Delivery address</legend><div class="form-grid"><label>Full name<input required name="name" autocomplete="name"><span class="field-error" data-error-for="name"></span></label><label>Country<select required name="country"><option>Singapore</option><option>Indonesia</option><option>Malaysia</option></select><span class="field-error" data-error-for="country"></span></label><label class="wide">Address<input required name="address1" autocomplete="address-line1"><span class="field-error" data-error-for="address1"></span></label><label class="wide">Address line 2<input name="address2" autocomplete="address-line2"></label><label>City<input required name="city" autocomplete="address-level2"><span class="field-error" data-error-for="city"></span></label><label>Postal code<input required name="postal" autocomplete="postal-code"><span class="field-error" data-error-for="postal"></span></label></div></fieldset><fieldset><legend>Payment demonstration</legend><div class="payment-options"><label><input type="radio" name="payment" value="Card demonstration" checked> Card demo</label><label><input type="radio" name="payment" value="PayNow demonstration"> PayNow demo</label></div><p class="prototype-note">No payment SDK, card field or transaction service is loaded.</p></fieldset><label class="terms-row"><input required name="terms" type="checkbox"> I understand this creates only a local demo order.<span class="field-error" data-error-for="terms"></span></label><p id="checkout-status" class="form-status" role="status" hidden></p><button class="btn" type="submit"><span>Place demo order</span><span>+</span></button></form><aside class="checkout-summary"><p class="mono">Your designs</p><div id="checkout-summary-lines"></div></aside></div></section></main><footer id="site-footer"></footer><script type="module" src="/assets/js/site.js"></script><script type="module" src="/assets/js/pages/checkout-page.js"></script></body></html>
